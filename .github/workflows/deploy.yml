name: Deploy

# Build the image, tag it with the commit SHA (never :latest), rewrite the
# compose image tag on the `deploy` branch, and poke Portainer. Portainer
# watches `deploy`, not `master`.
#
# Security: GitHub context values are never interpolated into `run:` scripts —
# they are passed through `env:` to avoid template injection.

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin the image tag on the deploy branch
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPO_OWNER}/${REPO_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B deploy
          sed -i "s|image: ${image}:.*|image: ${image}:${COMMIT_SHA}|g" docker-compose.yml
          grep -q "image: ${image}:${COMMIT_SHA}" docker-compose.yml
          git add docker-compose.yml
          git commit -m "ci: deploy ${COMMIT_SHA}" || echo "nothing to commit"
          git push origin deploy --force

      - name: Trigger Portainer redeploy
        uses: distributhor/workflow-webhook@2381f0e9c7b6bf061fb1405bd0804b8706116369 # v3.0.8
        with:
          webhook_url: ${{ secrets.PORTAINER_REDEPLOY_HOOK }}
          webhook_secret: "trigger"
