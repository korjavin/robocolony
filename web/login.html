<!DOCTYPE html>
<html lang="en" data-i18n-page="login">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in &mdash; robocolony</title>
<link rel="icon" href="data:,"><!-- there is no favicon; without this the console carries a 404 -->
<link rel="stylesheet" href="/css/app.css">
<style>
  /* Wide enough for the nav to sit on one line; the sign-in card itself is
     narrower and centred. This page used to link nowhere at all. */
  :root { --page: 40rem; }
  /* One card on paper: 1px rule, 2px offset, square corners, and the only
     button on the page carrying the inverted fill. */
  main {
    max-width: 24rem; margin: 6rem auto 0; text-align: center;
    border: 1px solid var(--line-1); box-shadow: var(--shadow-2);
    background: var(--bg-elev); padding: 2.5rem 2rem;
  }
  h1 { font-size: 1.8rem; }
  h1::before { content: "["; color: var(--fg-2); }
  h1::after { content: "]"; color: var(--fg-2); }
  .tag { margin: .5rem 0 2rem; color: var(--fg-2); }
  .btn { padding: .7rem 1.4rem; }
  footer { border: 0; margin-top: 2rem; text-align: center; }
</style>
<script type="module" src="/js/i18n.js"></script>
</head>
<body>
  <nav class="site" aria-label="Site" data-i18n-attr="aria-label">
    <a class="brand" href="/">robocolony</a>
    <a href="/lobby" data-i18n>Lobbies</a>
    <a href="/blueprints" data-i18n>Blueprints</a>
    <a href="/editor" data-i18n>Editor</a>
    <a href="/history" data-i18n>History</a>
    <a href="/help" data-i18n>Guide</a>
    <span class="grow"></span>
    <span class="lang" role="group" aria-label="Language" data-i18n-attr="aria-label"><button type="button" data-lang="en">🇬🇧 EN</button><button type="button" data-lang="de">🇩🇪 DE</button></span>
    <a href="/login" aria-current="page" data-i18n>Sign in</a>
    <form method="post" action="/auth/logout"><button type="submit" data-i18n>Sign out</button></form>
  </nav>

  <main>
    <h1>robocolony</h1>
    <p class="tag">Sign in to build blueprints and programs.</p>

    <!-- A plain link: the server mints the state and PKCE challenge. -->
    <a class="btn primary" href="/auth/login">Sign in with Google</a>

    <footer>Your Google account identifies you; nothing else is read from it.</footer>
  </main>
</body>
</html>
